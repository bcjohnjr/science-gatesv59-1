# RUN8_FIX_ID: V59.1-2026-09-08-split-FaIR-jobs-to-avoid-runner-shutdown
name: V59.1 scientific gates — FaIR + Hector

on:
  workflow_dispatch:
    inputs:
      run_hector:
        description: "Re-run Hector too (normally leave false; Hector already passed)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FAIR_SOURCE_DIR: /tmp/FAIR-v2.2.4

jobs:
  fair-paired:
    name: FaIR paired attribution + neutral non-CO2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned FaIR workload
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Clone official FaIR 2.2.4 source and calibration files
        run: |
          rm -rf "$FAIR_SOURCE_DIR"
          git clone --depth 1 --branch v2.2.4 https://github.com/OMS-NetZero/FAIR.git "$FAIR_SOURCE_DIR"
      - name: Verify flat source inputs
        run: |
          test -f external_validation_net_co2_trajectory.csv
          test -f "$FAIR_SOURCE_DIR/examples/data/calibrated_constrained_ensemble/calibrated_constrained_parameters_calibration1.4.1.csv"
          python -m py_compile run_fair_science_experiments.py
      - name: Run paired FaIR experiments
        run: |
          set -o pipefail
          python run_fair_science_experiments.py --mode paired 2>&1 | tee FAIR_PAIRED_CONSOLE.log
      - name: Verify paired outputs
        run: |
          python - <<'PY'
          import json, numpy as np, pandas as pd
          p = pd.read_csv('fair_paired_attribution.csv')
          n = pd.read_csv('fair_paired_attribution_neutral_nonco2.csv')
          z = np.load('fair_paired_members.npz', allow_pickle=False)
          s = json.load(open('fair_paired_summary.json'))
          assert z['co2_on'].shape[1] == 841 and z['co2_off'].shape[1] == 841
          assert len(p) > 500 and len(n) > 500
          assert s['common_state_audit']['co2_maxabs'] < 1e-6
          assert s['common_state_audit']['temp_maxabs'] < 1e-6
          print('Paired FaIR outputs verified.')
          PY
      - name: Upload paired FaIR outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fair-paired-science-gates
          retention-days: 30
          if-no-files-found: warn
          path: |
            fair_paired_attribution.csv
            fair_paired_attribution_neutral_nonco2.csv
            fair_paired_members.npz
            fair_neutral_nonco2.csv
            fair_paired_attribution_selected.csv
            fair_paired_summary.json
            FAIR_PAIRED_RUN_REPORT.txt
            FAIR_PAIRED_CONSOLE.log

  fair-inverse:
    name: FaIR inverse solve — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [2200, 2300, 2400]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned FaIR workload
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Clone official FaIR 2.2.4 source and calibration files
        run: |
          rm -rf "$FAIR_SOURCE_DIR"
          git clone --depth 1 --branch v2.2.4 https://github.com/OMS-NetZero/FAIR.git "$FAIR_SOURCE_DIR"
      - name: Verify flat source inputs
        run: |
          test -f external_validation_net_co2_trajectory.csv
          python -m py_compile run_fair_science_experiments.py
      - name: Run inverse FaIR target
        run: |
          set -o pipefail
          python run_fair_science_experiments.py --mode inverse --target ${{ matrix.target }} 2>&1 | tee FAIR_INVERSE_${{ matrix.target }}_CONSOLE.log
      - name: Verify inverse target output
        run: |
          python - <<'PY'
          import json, pandas as pd
          y = int('${{ matrix.target }}')
          s = pd.read_csv(f'fair_inverse_{y}_summary.csv')
          j = json.load(open(f'fair_inverse_{y}_summary.json'))
          assert set(s['criterion']) == {'absolute_280', 'member_relative_baseline'}
          assert set(s['target_year']) == {y}
          assert j['configs'] == 841 and j['target_year'] == y
          assert set(s['status']).issubset({'solved', 'already_met', 'not_bracketed'})
          print(f'Inverse FaIR {y} outputs verified.')
          PY
      - name: Upload inverse target outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fair-inverse-${{ matrix.target }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            fair_inverse_${{ matrix.target }}_summary.csv
            fair_inverse_${{ matrix.target }}_members.csv
            fair_inverse_${{ matrix.target }}_summary.json
            FAIR_INVERSE_${{ matrix.target }}_CONSOLE.log

  hector-science:
    if: ${{ inputs.run_hector }}
    name: Hector 3.5.0 paired carbon-cycle rerun
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true
      - name: System libraries for Hector
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libboost-filesystem-dev libboost-system-dev
      - name: Install Hector 3.5.0 without GitHub API dependency
        run: |
          Rscript -e 'install.packages(c("Rcpp", "BH", "jsonlite"), repos="https://cloud.r-project.org")'
          rm -rf /tmp/hector-v3.5.0
          git clone --depth 1 --branch v3.5.0 https://github.com/JGCRI/hector.git /tmp/hector-v3.5.0
          R CMD INSTALL --no-multiarch --with-keep.source /tmp/hector-v3.5.0
          Rscript -e 'library(hector); stopifnot(as.character(packageVersion("hector")) == "3.5.0")'
      - name: Run Hector paired experiment
        run: |
          set -o pipefail
          Rscript run_hector_paired.R 2>&1 | tee HECTOR_CONSOLE.log
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Hector outputs
        run: |
          python -m pip install pandas
          python verify_hector_outputs.py
      - name: Upload Hector outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hector-science-gates
          retention-days: 30
          if-no-files-found: warn
          path: |
            hector_paired_attribution.csv
            hector_removal_on_long.csv
            hector_removal_off_long.csv
            hector_science_summary.json
            HECTOR_CONSOLE.log
